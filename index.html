<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omni-Node Command Matrix</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4">
  <div class="max-w-4xl mx-auto space-y-4">
    <header class="border-b border-slate-800 pb-4">
      <h1 class="text-xl font-bold tracking-wider text-cyan-400">OMNI-NODE // TIER-3 KNOWLEDGE MATRIX</h1>
      <p class="text-xs text-slate-400">Exhaustive operational protocols across Cyber, Clinical, and Automation.</p>
    </header>

    <!-- Search & Filter Controls -->
    <div class="flex gap-2">
      <input type="text" id="searchInput" placeholder="Search protocol, CVE, drug class, or agent stack..." 
             class="w-full bg-slate-900 border border-slate-800 rounded p-2 text-sm focus:outline-none focus:border-cyan-500">
      <select id="categoryFilter" class="bg-slate-900 border border-slate-800 rounded p-2 text-sm text-slate-300">
        <option value="ALL">All Sectors</option>
        <option value="CYBER">Cyber & OSINT</option>
        <option value="CLINICAL">Clinical & Pharma</option>
        <option value="AUTOMATION">AI Automation</option>
      </select>
    </div>

    <!-- Node Grid Container -->
    <div id="nodeGrid" class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-2"></div>
  </div>

  <script>
    // PRE-POPULATED KNOWLEDGE BASE (Loaded Data, Zero Empty Forms)
    const masterNodes = [
      {
        id: "NODE-001",
        sector: "CYBER",
        title: "Linux Privilege Escalation via Weak Permissions",
        summary: "Extraction and cracking of /etc/shadow hashes using John the Ripper.",
        payload: "cat /etc/shadow | grep -E '^root'\njohn --wordlist=/usr/share/wordlists/rockyou.txt hashes.txt",
        impact: "Root compromise via readable configuration files."
      },
      {
        id: "NODE-002",
        sector: "CYBER",
        title: "Passive Network Sniffing & Packet Interception",
        summary: "ARP poisoning execution and credential capture over unencrypted protocols.",
        payload: "ettercap -T -M arp:remote /192.168.1.1/ /192.168.1.50/\nwireshark -k -i eth0 -f 'tcp port 80'",
        impact: "Plaintext credential extraction and session hijacking."
      },
      {
        id: "NODE-003",
        sector: "CLINICAL",
        title: "Acute Anaphylaxis Emergency Intervention",
        summary: "Immediate first-line hemodynamic stabilization and airway preservation.",
        payload: "1. Epinephrine 1:1000 (0.3-0.5 mg IM in anterolateral thigh)\n2. High-flow O2 (10-15 L/min)\n3. Normal Saline 1-2 L rapid IV bolus\n4. Diphenhydramine 50 mg IV + Ranitidine 50 mg IV\n5. Hydrocortisone 200 mg IV",
        impact: "Prevents fatal laryngeal edema and circulatory collapse."
      },
      {
        id: "NODE-004",
        sector: "AUTOMATION",
        title: "Automated YouTube Video Engine (Headless Codespace)",
        summary: "Cloud-based video script generation, TTS synthesis, and automated assembly.",
        payload: "python -m venv env && source env/bin/activate\npip install edge-tts moviepy\npython generate_pipeline.py --niche 'OSINT Defense'",
        impact: "Scales programmatic digital distribution without local GPU load."
      }
    ];

    const grid = document.getElementById('nodeGrid');
    const search = document.getElementById('searchInput');
    const filter = document.getElementById('categoryFilter');

    function render(data) {
      grid.innerHTML = data.map(n => `
        <div class="border border-slate-800 bg-slate-900/60 p-4 rounded space-y-2 hover:border-cyan-500/50 transition">
          <div class="flex justify-between items-center text-xs">
            <span class="text-cyan-400 font-mono font-semibold">${n.id}</span>
            <span class="px-2 py-0.5 rounded bg-slate-800 text-slate-400 text-[10px] font-mono">${n.sector}</span>
          </div>
          <h3 class="font-bold text-sm text-white">${n.title}</h3>
          <p class="text-xs text-slate-300">${n.summary}</p>
          <div class="bg-black/60 p-2 rounded border border-slate-800 font-mono text-[11px] text-emerald-400 overflow-x-auto whitespace-pre">${n.payload}</div>
          <div class="text-[10px] text-slate-500"><strong class="text-slate-400">Critical Core:</strong> ${n.impact}</div>
        </div>
      `).join('');
    }

    function update() {
      const q = search.value.toLowerCase();
      const cat = filter.value;
      const filtered = masterNodes.filter(n => {
        const matchesCat = cat === "ALL" || n.sector === cat;
        const matchesSearch = n.title.toLowerCase().includes(q) || 
                              n.summary.toLowerCase().includes(q) || 
                              n.payload.toLowerCase().includes(q);
        return matchesCat && matchesSearch;
      });
      render(filtered);
    }

    search.addEventListener('input', update);
    filter.addEventListener('change', update);
    render(masterNodes);
  </script>
</body>
</html>
